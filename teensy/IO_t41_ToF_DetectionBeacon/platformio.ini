[env:beacon-tof]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

monitor_speed = 921600

; CPU @ 600 MHz (defaut Teensy 4.1). Test 912 MHz : crash thermique a ~1 min en
; boitier ferme. Le calcul prend 9 us / 60 ms cycle (CPU non-bottleneck), donc
; aucun benefice perf a monter en frequence.
; board_build.f_cpu = 912000000L

; Toutes les librairies sont dans lib/ (versions modifiées du projet original)
; Pas de lib_deps externes
